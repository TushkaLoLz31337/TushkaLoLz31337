<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">TUSHKA — Open systems. Shared power.</title>
  <desc id="desc">A dark architectural banner with an angular Tushka sigil, orbital lines, and a bold statement about decentralized open source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080d18"/><stop offset=".55" stop-color="#111d30"/><stop offset="1" stop-color="#07121a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8cf4d2"/><stop offset=".5" stop-color="#4bb7ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8ca6c4" stroke-opacity=".10" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M760 -30C920 60 1010 70 1240 8M720 390C930 270 1060 280 1240 330" fill="none" stroke="#62d9cb" stroke-opacity=".18" stroke-width="2"/>
  <circle cx="1000" cy="180" r="190" fill="none" stroke="#79baff" stroke-opacity=".12"/>
  <circle cx="1000" cy="180" r="140" fill="none" stroke="#79baff" stroke-opacity=".16" stroke-dasharray="4 12"/>
  <g transform="translate(90 68)" filter="url(#glow)">
    <path d="M92 0H238L205 54H157V214L105 262V54H58Z" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linejoin="round"/>
    <path d="M34 240L100 174M222 36L280 94" stroke="#8cf4d2" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <circle cx="169" cy="132" r="118" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="2 12" opacity=".7"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="420" y="128" fill="#f4f8ff" font-size="72" font-weight="800" letter-spacing="10">TUSHKA</text>
    <text x="425" y="180" fill="#9fe8dc" font-size="20" font-weight="700" letter-spacing="5">OPEN SYSTEMS. SHARED POWER.</text>
    <path d="M425 207H1040" stroke="url(#accent)" stroke-width="2" opacity=".8"/>
    <text x="425" y="250" fill="#d5e1ef" font-size="21" letter-spacing="1.3">Build infrastructure the community can own.</text>
    <text x="425" y="286" fill="#91a8c2" font-size="15" letter-spacing="3">DECENTRALIZED • OPEN SOURCE • VERIFIABLE</text>
  </g>
  <g fill="#8cf4d2"><circle cx="1085" cy="72" r="4"/><circle cx="1125" cy="112" r="3"/><circle cx="1060" cy="290" r="4"/></g>
</svg>